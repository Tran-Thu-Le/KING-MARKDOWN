[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "king-markdown"
version = "0.3.0"
description = "KING Markdown (.kg.md): Markdown mở rộng cho đồ thị tri thức. Knowledge is KING."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
king = "king_markdown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
king_markdown = ["web/*.html", "web/*.css", "web/js/*.js"]
